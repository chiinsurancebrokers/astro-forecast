<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t.title }}</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080e20;color:#edf0fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#30204c77,transparent 50%),#080e20}main{max-width:1100px;margin:auto;padding:28px 22px 80px}nav{display:flex;justify-content:space-between;align-items:center;gap:20px}a{color:#d3c1ff}a[aria-current]{color:#fff;text-decoration-thickness:3px}h1{font-size:clamp(30px,5vw,54px);line-height:1.18;max-width:800px;font-weight:580;letter-spacing:-1.3px}h2{font-size:26px}h3{font-size:21px}p{line-height:1.75}.eyebrow{color:#d9bb80;text-transform:uppercase;letter-spacing:3px;font-size:12px;margin-top:50px}.intro{max-width:730px;color:#b8c2d9;font-size:18px}.panel{background:#111a2dcc;border:1px solid #35405b;border-radius:20px;padding:26px;margin:28px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}label{display:flex;flex-direction:column;gap:10px;font-size:15px}label.check{flex-direction:row;align-items:center;margin-top:20px}textarea,select,button{font:inherit;color:inherit;background:#111d35;border:1px solid #54607b;border-radius:10px;padding:13px}textarea{resize:vertical;min-height:110px;width:100%}input[type=checkbox]{accent-color:#b49ada;width:19px;height:19px}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e0be7d;outline-offset:5px}.primary{background:#8d6ac5;border-color:#b293df;font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:22px}button:disabled{cursor:default;opacity:.6}.muted,small{color:#aab6ce;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;margin:28px 0}.cards.single{grid-template-columns:minmax(220px,320px);justify-content:center}.slot>p{min-height:45px;text-align:center;color:#d0bbec}.tarot-card{width:100%;min-height:300px;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center;border:1px solid #a88a55;border-radius:18px;padding:25px 16px;background:radial-gradient(circle at center,#3d315f 0%,#121c38 65%);box-shadow:0 14px 45px #0005;position:relative}.tarot-card:before{content:'';position:absolute;inset:9px;border:1px solid #bda67566;border-radius:11px;pointer-events:none}.tarot-card .symbol{font-family:Georgia,serif;font-size:76px;color:#e2c694;line-height:1.3}.tarot-card .title{font-size:22px;max-width:90%}.tarot-card .position{font-size:12px;letter-spacing:2px;color:#c7b28a}.tarot-card[disabled]{opacity:1}.tarot-card.revealed{background:radial-gradient(circle at 50% 40%,#61505255,#101b32 65%)}.tarot-card.reversed .symbol{transform:rotate(180deg)}.interpretation{border-top:1px solid #39455f;margin-top:25px;padding-top:18px}.reflection{border-left:2px solid #d0ad72;padding-left:18px;color:#d8c6f0}.error{color:#ffbdbd}[hidden]{display:none!important}#status{min-height:28px}details{margin:25px 0}summary{cursor:pointer;color:#d8c5ff}.footer{margin-top:35px;border-top:1px solid #293650;padding-top:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.cards{gap:10px}.tarot-card{min-height:205px;padding:16px 8px}.tarot-card .symbol{font-size:44px}.tarot-card .title{font-size:16px}.tarot-card .position{letter-spacing:0;font-size:11px}.slot>p{font-size:13px;min-height:65px}.panel{padding:20px}main{padding:20px 15px 50px}}
@media(max-width:390px){.cards{grid-template-columns:1fr;max-width:255px;margin:auto}.slot>p{min-height:0}.tarot-card{min-height:300px}}
@media(prefers-reduced-motion:no-preference){.tarot-card{transition:background .3s,transform .3s}.tarot-card:not([disabled]):hover{transform:translateY(-6px)}}
</style></head><body><main>
<nav><a href="/platform">← {{ t.back }}</a><div aria-label="Language"><a href="/tarot?lang=el" {% if lang=='el' %}aria-current="page"{% endif %}>ΕΛ</a> · <a href="/tarot?lang=en" {% if lang=='en' %}aria-current="page"{% endif %}>EN</a></div></nav>
<p class="eyebrow">{{ t.eyebrow }}</p><h1>{{ t.heading }}</h1><p class="intro">{{ t.intro }}</p>
<section class="panel"><form id="tarot-form"><div class="grid"><label>{{ t.question }}<textarea id="question" maxlength="500" placeholder="{{ t.placeholder }}"></textarea></label><div><label>{{ t.spread }}<select id="spread"><option value="three">{{ t.three }}</option><option value="one">{{ t.one }}</option></select></label><label class="check"><input id="reversals" type="checkbox" checked>{{ t.reversals }}</label></div></div><p class="muted">{{ t.privacy }}</p><button id="draw" class="primary" type="submit">{{ t.draw }}</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="spread-view" hidden><div id="cards" class="cards"></div><button id="reveal-all" type="button">{{ t.reveal_all }}</button></section>
<section id="reading" class="panel" hidden aria-live="polite"></section>
<p class="muted footer">{{ t.note }}</p>
</main><script id="tarot-config" type="application/json">{{ {'lang':lang,'t':t}|tojson }}</script><script src="{{ url_for('static',filename='tarot.js') }}"></script></body></html>
